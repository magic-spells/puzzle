<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0f">
  <title>Overlays — Puzzle &lt;Portal&gt;</title>
  <link href="/styles.css" rel="stylesheet">
  <style>
    /* -------------------------------------------------------------------
       Page shell. Globals only — every component styles itself from its own
       <style> block, which the build folds into /styles.css.
       ------------------------------------------------------------------- */
    :root {
      --bg: #0b0b0f;
      --surface: #15151b;
      --surface-2: #1c1c24;
      --fg: #f2f0ec;
      --muted: rgba(242, 240, 236, 0.62);
      --faint: rgba(242, 240, 236, 0.34);
      --line: rgba(255, 255, 255, 0.09);
      --accent: #7dd3a7;
      --danger: #e0796b;
      --radius: 14px;
      --mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    /* <puzzle-view> is a custom element, so it defaults to display:inline —
       which silently voids the max-width/margins on view and layout roots. */
    puzzle-view { display: block; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(90% 55% at 50% -12%, rgba(125, 211, 167, 0.10), transparent 62%),
        var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Shared primitives used across the demo components. */
    .btn {
      appearance: none;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .btn:hover { background: #24242e; border-color: rgba(255, 255, 255, 0.16); }
    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1a13;
      font-weight: 600;
    }
    .btn-accent:hover { background: #93e0b8; border-color: #93e0b8; }
    .btn-danger { color: var(--danger); border-color: rgba(224, 121, 107, 0.4); }
    .btn-danger:hover { background: rgba(224, 121, 107, 0.12); border-color: rgba(224, 121, 107, 0.6); }

    :where(button):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--faint);
    }

    code {
      font-family: var(--mono);
      font-size: 0.9em;
      padding: 1px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.07);
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
