<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle · i18n</title>
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
  <!-- The runtime sets <html lang> to the active locale on load and on every
       switch. Prerendered builds (--hybrid, --static) also inject the default
       locale's table at the end of the body, so an English visitor fetches nothing. -->
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
