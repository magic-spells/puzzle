<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle · i18n</title>
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
  <!-- The runtime sets <html lang> to the locale the URL names (/es/… is
       Spanish). Prerendered builds (--hybrid, --static) write one copy of every
       page per locale, each with its own <html lang> and its own table at the end
       of the body, so no visitor fetches strings. -->
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
