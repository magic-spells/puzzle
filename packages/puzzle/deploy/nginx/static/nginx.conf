# nginx server block for a puzzle app built with output: 'static' (true static
# pages, no router). written by `puzzle add deploy nginx --static`.
#
# copy this into your nginx config (for example
# /etc/nginx/sites-available/my-app), point root at the uploaded dist/
# folder, then check and reload: nginx -t && nginx -s reload

server {
	listen 80;
	server_name example.com;

	# the folder `puzzle build` wrote (upload dist/ here)
	root /var/www/my-app/dist;
	index index.html;

	# a path with no page gets dist/404.html, with a 404 status
	error_page 404 /404.html;

	# hashed production names (styles-<hash>.css, _puzzle/<slug>-<hash>.js,
	# _puzzle/chunks/chunk-<hash>.js, locales/<tag>.<hash>.json) change on
	# every build that changes their content, so browsers may keep them for a
	# year. the match is case-sensitive on purpose: the hash is upper-case
	# base32.
	location ~ "[-.][A-Z2-7]{8}\.(js|css|json)$" {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# clean urls: /about is dist/about/index.html. no shell fallback, so a
	# missing page is a real 404.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ =404;
	}

	# with i18n.routing: 'prefix', each other locale has its own 404 page.
	# add one block per locale so its missing paths get it (es shown here):
	#
	# location /es/ {
	# 	add_header Cache-Control "no-cache";
	# 	error_page 404 /es/404.html;
	# 	try_files $uri $uri/ =404;
	# }

	# optional: compress text responses
	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
}
