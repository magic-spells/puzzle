# nginx server block for a puzzle app built as an spa (the default) or with
# output: 'hybrid'. written by `puzzle add deploy nginx`.
#
# copy this into your nginx config (for example
# /etc/nginx/sites-available/my-app), point root at the uploaded dist/
# folder, then check and reload: nginx -t && nginx -s reload

server {
	listen 80;
	server_name example.com;

	# the folder `puzzle build` wrote (upload dist/ here)
	root /var/www/my-app/dist;
	index index.html;

	# hashed production names (app-<hash>.js, styles-<hash>.css,
	# chunks/chunk-<hash>.js, locales/<tag>.<hash>.json) change on every build
	# that changes their content, so browsers may keep them for a year. the
	# match is case-sensitive on purpose: the hash is upper-case base32.
	location ~ "[-.][A-Z2-7]{8}\.(js|css|json)$" {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# everything else: a real file, then a prerendered page
	# (hybrid's dist/<path>/index.html), then the shell, so the router draws
	# client-side routes on a refresh or a deep link instead of a 404.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}

	# optional: compress text responses
	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
}
