name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  test:
    # The sheet motion suites pin EXACT floats minted on macOS/arm64 (ported
    # byte-identical from @magic-spells/sheet — assertions are never loosened
    # to fit a platform). ubuntu/x64 rounds one accumulated step differently
    # in the last ULP, so the pins must run on the platform that minted them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Registry lib tests
        run: |
          npm ci
          npm test
      - name: Demo compiles against the pinned framework
        working-directory: demo
        run: |
          npm ci
          npm run build
