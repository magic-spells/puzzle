name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Registry lib tests
        run: |
          npm ci
          npm test
      - name: Demo compiles against the pinned framework
        working-directory: demo
        run: |
          npm ci
          npm run build
